services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: katamino
      POSTGRES_PASSWORD: katamino
      POSTGRES_DB: katamino
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katamino"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./app/.env
    environment:
      DATABASE_URL: postgresql://katamino:katamino@db:5432/katamino

volumes:
  postgres_data:
